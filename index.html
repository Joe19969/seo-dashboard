<style>
:root{--sidebar:#eef0f2;--sidebar-border:#e3e5e8;--bg:#f4f5f6;--card:#fff;--ink:#1a1d21;--muted:#6b7280;--line:#ececec;--gsc:#1a73e8;--bing:#008272;--ever:#0f9d58;--timely:#c97a00;--up:#0f9d58;--down:#d93025;--warn:#b06000;--radius:12px;--shadow:0 1px 2px rgba(16,24,40,.04),0 1px 1px rgba(16,24,40,.03);--sans:"Inter","PingFang SC","Noto Sans SC","Segoe UI",system-ui,sans-serif}

.brand{padding:16px 16px 12px}.brand .logo{font-weight:700;font-size:14px}.brand .site{color:var(--muted);font-size:12px}

.main{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column}

.topbar h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.03em}.topbar .sub{margin:4px 0 0;color:var(--muted);font-size:13px}

select,input[type=date]{font:inherit;font-size:12.5px;border:1px solid #e5e7eb;border-radius:8px;padding:5px 8px;background:#fff;color:var(--ink)}

.periodbar .warnline{color:var(--warn)}
.content{padding:8px 28px 64px;max-width:1180px;flex:1}
section.view{display:none}section.view.active{display:block}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px 12px;min-height:128px}
.kpi .lbl{font-size:11px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:6px}

.delta.up{color:var(--up)}.delta.down{color:var(--down)}.delta.flat{color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}

.grid{stroke:#f0f0f0}.tick{fill:var(--muted);font-size:10px;font-family:var(--sans)}.legend{fill:var(--ink);font-size:11px;font-family:var(--sans)}
.wknd{fill:#f3efe6}.lag{fill:#f8e4d8;opacity:.7}.pa{fill:#e8f0fe;opacity:.55}.pb{fill:#f1f3f4;opacity:.8}.ub-core{fill:#f6b8b1;opacity:.78}.ub-spam{fill:#fbd9a0;opacity:.82}.ub-other{fill:#bcd3f5;opacity:.68}
.ub-label{font-size:10px;font-weight:650;font-family:var(--sans)}.ub-label.core{fill:#a50e0e}.ub-label.spam{fill:#7a4d00}.ub-label.other{fill:#174ea6}

details summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin-top:6px}

.modal h3{margin:0 0 8px;font-size:16px}.modal p,.modal li{margin:0 0 8px;color:#374151;font-size:13px}
.banner{margin:0 28px 10px;padding:8px 14px;border-radius:10px;background:#fef3e0;color:#7a4500;font-size:12.5px}

@media print{.sidebar,.top-actions{display:none}section.view{display:block!important}}

  const card2=`<div class="card"><h2>固定词篮（主指标）</h2><p class="desc">词篮 ${fmt(N)} 词（v37，2026-11-25 重定义）：v35 的 232 词原篮中基线来源的 199 词去掉 9 个品牌词；原篮存档保留作对照，季度再评估。本周中位排名 ${wA.median!=null?wA.median.toFixed(1):'—'} vs 上周 ${wB.median!=null?wB.median.toFixed(1):'—'}（${medChg!=null?(medChg>=0?'变差 +':'改善 ')+medChg.toFixed(1)+' 位':'—'}）；Top 10 词数 ${fmt(wA.top10)} vs ${fmt(wB.top10)}（${topChg!=null?(topChg>=0?'+':'')+topChg:'—'}）；本周覆盖 ${fmt(wA.covered)} / ${fmt(N)}（${covPct}%）。</p><p class="desc">注意：篮子是「持久篮」不是常青篮——${fmt(N)} 词中 ${fmt(newsN)} 个是资讯词，每周覆盖只有约 ${covPct}%（本周），中位排名受资讯词进出影响大${spikeW&&spikeW.median>=15?`（${esc(spikeW.week)} 周中位 ${spikeW.median.toFixed(1)} 为尖峰周）`:''}，以稳定核心为准。稳定核心（${core.n} 个词，${wks.length} 周均有展现）中位排名 ${coreA.median!=null?coreA.median.toFixed(1):'—'} vs 上周 ${coreB.median!=null?coreB.median.toFixed(1):'—'}，是另一可比信号。32 个机会代表词因 5 周从未进 Top 2000、无可量化排名信号，另立观察清单，见下。</p>${chartW}<div class="table-wrap"><table><thead><tr><th class="txt">周</th><th>中位排名</th><th>稳定核心中位</th><th>Top 10</th><th>覆盖</th><th>1–3</th><th>4–10</th><th>11–20</th><th>21+</th><th>无展现</th></tr></thead><tbody>${trendRows}</tbody></table></div></div>`;
  const GL={home:'首页',product:'产品核心',stocks:'股票个股',market:'市场行情',etf:'ETF 与对比',aime_share:'Aime 分享页',other_ever:'其他常青页',news:'英文资讯',news_lang:'多语言资讯',functional:'功能入口',subdomain:'子域与其他主机',unmapped:'未映射（无落地页）'};
  const gRows=(groups).map(g=>`<tr><td class="txt">${esc(GL[g.group]||g.group)}</td><td>${fmt(g.basket_n)}</td><td>${fmt(g.covered)}</td><td>${g.median!=null?g.median.toFixed(1):'—'}</td><td>${fmt(g.top10)}</td></tr>`).join('');
  const card3=`<div class="card"><h2>各组词篮中位排名（本周 ${esc(wA.week||'')}）</h2><p class="desc">按查询在基线的首要落地页归组（groups.json）。未映射 = 机会代表词在 GSC 里无落地页（从未有展现）。</p><div class="table-wrap"><table><thead><tr><th class="txt">业务分组</th><th>词篮词数</th><th>覆盖</th><th>中位排名</th><th>Top 10</th></tr></thead><tbody>${gRows}</tbody></table></div></div>`;
  const mv=isFriR?(R.movers_fri||{up:[],down:[]}):(R.movers||{up:[],down:[]});
  const mrow=m=>`<tr><td class="txt">${esc(m.query)}</td><td>${m.prev_pos!=null?m.prev_pos.toFixed(1):'—'}</td><td>${m.cur_pos!=null?m.cur_pos.toFixed(1):'—'}</td><td>${m.change!=null?(m.change>0?'+':'')+m.change.toFixed(1):'—'}</td><td>${fmt(m.impr)}</td><td>${fmt(m.clicks)}</td><td class="txt">${esc((m.page||'').replace('https://www.ainvest.com','')||'—')}</td></tr>`;
  const mhead='<thead><tr><th class="txt">查询</th><th>上周排名</th><th>本周排名</th><th>变化</th><th>展现</th><th>点击</th><th class="txt">落地页</th></tr></thead>';
  const upH=mv.up.length?`<div class="table-wrap"><table>${mhead}<tbody>${mv.up.map(mrow).join('')}</tbody></table></div>`:'<p class="desc">本周无符合条件的上升词（两周展现都 ≥50 才进榜）。</p>';
  const dnH=mv.down.length?`<div class="table-wrap"><table>${mhead}<tbody>${mv.down.map(mrow).join('')}</tbody></table></div>`:'<p class="desc">本周无符合条件的下降词（两周展现都 ≥50 才进榜）。</p>';
  const card4=`<div class="card"><h2>排名涨跌榜</h2><p class="desc">词篮内本周（${esc(mv.cur_week||wA.week||'')}）vs 上周（${esc(mv.prev_week||wB.week||'')}），两周展现都 ≥50 才进榜；变化 = 上周排名 − 本周排名（正数 = 上升）。符合条件 ${fmt(mv.candidates||0)} 个词。</p><p class="desc"><b>上升最多</b></p>${upH}<p class="desc"><b>下降最多</b></p>${dnH}</div>`;
  const wl=R.watchlist||[];
  const card5=wl.length?`<div class="card"><h2>机会观察清单（${fmt(wl.length)} 词）</h2><p class="desc">机会池各卡片的代表词，2026-10-17–2026-11-20 五周从未进 Top 2000 查询榜，无可量化排名信号，故不在词篮内，单独观察。哪天某词进了周榜，季度复评时再议是否入篮。</p><p class="desc">${wl.map(w=>esc(w.q)).join('、')}</p></div>`:'';
  return card1+card2+card3+card4+card5;
}
const VIEWS={overview:vOverview,findings:vFindings,evergreen:vEvergreen,compare:vCompare,index:vIndex,risks:vRisks,updates:vUpdates,
  folders:()=>vTables(['hosts','folders']),devices:()=>vTables(['devices','countries']),queries:()=>vBrand()+vTables(['queries']),pages:()=>vTables(['pages']),

const ENGINE_AWARE=new Set(['overview','evergreen']);

function scrollToTop(){ try{ const m=document.querySelector('.main'); if(m) m.scrollTop=0; }catch(_){} try{ document.documentElement.scrollTop=0; }catch(_){} try{ document.body.scrollTop=0; }catch(_){} try{ window.scrollTo(0,0); }catch(_){} }
function renderNav(){ document.getElementById('nav').innerHTML=SECTIONS.map(g=>`<div class="nav-group"><div class="nav-label">${g.group}</div>`+g.items.map(([id,t])=>{ let b=''; if(id==='risks'&&badge.risks) b=`<span class="badge">${badge.risks}</span>`; if(id==='opps'&&badge.opps) b=`<span class="badge soft">${badge.opps}</span>`;
  return `<a href="#${id}" data-s="${id}" class="${id===current?'active':''}"><span>${t}</span>${b}</a>`;}).join('')+'</div>').join('');
  document.querySelectorAll('#nav a').forEach(a=>a.onclick=e=>{e.preventDefault(); current=a.dataset.s; render(); scrollToTop(); try{ requestAnimationFrame(scrollToTop); }catch(_){} try{ setTimeout(scrollToTop,60); }catch(_){} try{history.replaceState(null,'','#'+current);}catch(_){} }); }
function renderControls(){
  const modes=[['week','周'],['month','月'],['custom','自定义']]; if(presets.length) modes.push(['preset','预设']);
  document.getElementById('modeSeg').innerHTML=modes.map(([k,t])=>`<button data-m="${k}" class="${state.mode===k?'on':''}">${t}</button>`).join('');
  document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{state.mode=b.dataset.m; render();});
  document.getElementById('engSeg').innerHTML=[['all','全部'],['google','Google'],['bing','Bing']].map(([k,t])=>`<button data-e="${k}" class="${state.engine===k?'on':''}">${t}</button>`).join('');
  document.getElementById('engSeg').style.display=ENGINE_AWARE.has(current)?'':'none';
  document.querySelectorAll('#engSeg button').forEach(b=>b.onclick=()=>{state.engine=b.dataset.e; render();});
  // 视角切换（v40）：按钮上直接写出各视角当前对比的日期；切换后周下拉/KPI/周表/提醒全部按该视角重算
  const _wM=(weeksFor('mon')[state.wiByView.mon]||weeksFor('mon')[0]), _wF=(weeksFor('fri')[state.wiByView.fri]||weeksFor('fri')[0]);
  document.getElementById('viewSeg').innerHTML=[['mon','周一周会',_wM],['fri','周五周会',_wF]].map(([k,t,w])=>`<button data-v="${k}" class="${state.view===k?'on':''}">${t} ${w?md(w[0])+'–'+md(w[1]):''}</button>`).join('');
  document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
  let h=''; if(state.mode==='week') h=`<select id="selW">${weeks.slice(0,-1).map((w,i)=>`<option value="${i}" ${i===state.wi?'selected':''}>${md(w[0])}–${md(w[1])}${isIncompleteWeek(state.view,w)?'（未完整）':''}</option>`).join('')}</select>`;
  else if(state.mode==='month') h=`<select id="selM">${months.slice(1).map((m,i)=>`<option value="${i+1}" ${i+1===state.mi?'selected':''}>${m}</option>`).join('')}</select>`;
  else if(state.mode==='preset') h=`<select id="selP">${presets.map((p,i)=>`<option value="${i}" ${i===state.preset?'selected':''}>${esc(p.label)}</option>`).join('')}</select>`;
  else { const c=state.custom; h=`<span class="tagA">本期</span> <input type="date" id="a0" value="${c.a[0]}"> – <input type="date" id="a1" value="${c.a[1]}"> <span class="tagB">对照</span> <input type="date" id="b0" value="${c.b[0]}"> – <input type="date" id="b1" value="${c.b[1]}">`; }
  document.getElementById('modeCtl').innerHTML=h; const pl=PERIODLESS.has(current); document.getElementById('modeSeg').style.display=pl?'none':''; document.getElementById('modeCtl').style.display=pl?'none':''; const on=(id,f)=>{const el=document.getElementById(id); if(el) el.onchange=f;};
  on('selW',e=>{state.wi=+e.target.value;render();}); on('selM',e=>{state.mi=+e.target.value;render();}); on('selP',e=>{state.preset=+e.target.value;render();});
  ['a0','a1','b0','b1'].forEach(id=>on(id,()=>{const g=i=>document.getElementById(i).value; if(g('a0')>g('a1')||g('b0')>g('b1')) return; state.custom={a:[g('a0'),g('a1')],b:[g('b0'),g('b1')]}; render();}));
}
function periodBar(P,R){
  const w=[]; if(P.note) w.push(P.note);
  const x=R.sess[state.engine]; if(x.A.n<x.A.days||x.B.n<x.B.days) w.push(`GA4 覆盖 本期 ${x.A.n}/${x.A.days} 天 · 对照 ${x.B.n}/${x.B.days} 天`);
  if(x.A.nc<x.A.n||x.B.nc<x.B.n) w.push(`落地页分组覆盖 本期 ${x.A.nc}/${x.A.n} 天 · 对照 ${x.B.nc}/${x.B.n} 天`);
  for(const e of ['google','bing']){ const a=R.eng[e].A,b=R.eng[e].B; if(a.n<a.days||b.n<b.days) w.push(`${ENAME[e]} 覆盖 本期 ${a.n}/${a.days} 天 · 对照 ${b.n}/${b.days} 天`); }
  if(P.A[1]>completeEnd) w.push(`本期含可能未齐的日期（完整日截至 ${ga4CompleteDay}（纽约））`);
  if(span(...P.A).length!==span(...P.B).length) w.push('两段天数不同，涨跌按日均计算');
  return `<span class="tagA">本期</span> ${P.A[0]} 至 ${P.A[1]}（${span(...P.A).length} 天） <span class="tagB">对照</span> ${P.B[0]} 至 ${P.B[1]}（${span(...P.B).length} 天）`+(w.length?` <span class="warnline">· ${w.map(esc).join(' · ')}</span>`:'');
}
function render(){
  if(!VIEWS[current]) current='overview';

  badge.risks=AUTO.filter(a=>a.level==='高').length+risks.filter(r=>r.level==='高').length;

  const P=periods(), pb=document.getElementById('periodbar'), ct=document.getElementById('content');

  if(!P.A||!P.B){ pb.innerHTML='<span class="warnline">数据不足以形成对比区间。</span>'; ct.innerHTML=''; return; }
  const R=metrics(P); pb.innerHTML=periodBar(P,R); ct.innerHTML=`<section class="view active">${VIEWS[current](P,R)}</section>`;
}

document.getElementById('foot').innerHTML=`完整日截至 ${ga4CompleteDay}（纽约）<br>GA4 截至 ${minD(lastSG,lastSB)||'—'}（纽约） · GSC ${lastG||'—'}（太平洋） · Bing ${lastB||'—'}（UTC）<br>Google 收录观测 ${IDX.length?IDX[IDX.length-1].date:'—'}（太平洋）`;
if(M.ga4_stale) document.getElementById('banner').innerHTML=`<div class="banner">GA4 本次未刷新，数据截至 ${esc(M.ga4_stale_through||'—')}</div>`;
else if(M.banner) document.getElementById('banner').innerHTML=`<div class="banner">${esc(M.banner)}</div>`;
document.getElementById('methodBody').innerHTML=`<h3>方法与口径</h3>${(D.method||[]).map(p=>`<p>${esc(p)}</p>`).join('')}<p><b>常青 / 时效分组：</b></p><ul>${top.map(g=>`<li>${g.type==='evergreen'?'常青':g.type==='timely'?'时效':'未归类'} · ${esc(g.label)}${g.rule?`：<code>${esc(g.rule)}</code>`:''}</li>`).join('')}</ul><p style="text-align:right"><button class="btn" id="btn-close">关闭</button></p>`;

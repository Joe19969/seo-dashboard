<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ainvest.com · 自然搜索看板</title>
<style>
:root{--sidebar:#eef0f2;--sidebar-border:#e3e5e8;--bg:#f4f5f6;--card:#fff;--ink:#1a1d21;--muted:#6b7280;--line:#ececec;--gsc:#1a73e8;--bing:#008272;--ever:#0f9d58;--timely:#c97a00;--up:#0f9d58;--down:#d93025;--warn:#b06000;--radius:12px;--shadow:0 1px 2px rgba(16,24,40,.04),0 1px 1px rgba(16,24,40,.03);--sans:"Inter","PingFang SC","Noto Sans SC","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13.5px/1.5 var(--sans)}
body{display:flex;min-height:100vh}
a{color:var(--gsc);text-decoration:none}a:hover{text-decoration:underline}
code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;background:#f3f4f6;padding:0 4px;border-radius:4px}
.sidebar{width:232px;flex:0 0 232px;background:var(--sidebar);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:16px 16px 12px}.brand .logo{font-weight:700;font-size:14px}.brand .site{color:var(--muted);font-size:12px}
.brand .pill{display:inline-block;margin-top:8px;font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--sidebar-border);border-radius:999px;padding:2px 8px}
.nav-group{padding:6px 10px 10px}.nav-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8b919a;padding:8px 8px 4px}
.sidebar a{display:flex;align-items:center;gap:8px;color:var(--ink);padding:7px 8px;border-radius:8px;font-size:13px;font-weight:500}
.sidebar a:hover{background:rgba(255,255,255,.65);text-decoration:none}
.sidebar a.active{background:#fff;box-shadow:var(--shadow);font-weight:600}
.sidebar a .badge{margin-left:auto;font-size:11px;font-weight:650;color:#fff;background:var(--down);border-radius:999px;padding:0 7px}
.sidebar a .badge.soft{background:#9aa0a6}
.sidebar-foot{margin-top:auto;padding:12px 16px 16px;font-size:11px;color:var(--muted);border-top:1px solid var(--sidebar-border)}
.main{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 28px 8px;flex-wrap:wrap}
.topbar h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.03em}.topbar .sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;font-family:inherit}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:inline-flex;background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:2px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
select,input[type=date]{font:inherit;font-size:12.5px;border:1px solid #e5e7eb;border-radius:8px;padding:5px 8px;background:#fff;color:var(--ink)}
.periodbar{margin:0 28px 10px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:10px;font-size:12.5px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.periodbar .tagA,.periodbar .tagB{font-weight:650;padding:1px 8px;border-radius:6px}
.tagA{background:#e8f0fe;color:#1a56c2}.tagB{background:#f1f3f4;color:#444}
.periodbar .warnline{color:var(--warn)}
.content{padding:8px 28px 64px;max-width:1180px;flex:1}
section.view{display:none}section.view.active{display:block}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px 12px;min-height:128px}
.kpi .lbl{font-size:11px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:6px}
.kpi .val{font-size:24px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:4px 0 2px}
.kpi .hint,.hint{font-size:11px;color:var(--muted)}
.delta{font-size:11px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}.delta.flat{color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px 18px;margin:0 0 14px}
.card h2{margin:0 0 2px;font-size:15px;font-weight:650;letter-spacing:-.02em}.card h3{margin:0 0 8px;font-size:13.5px;font-weight:650}
.desc{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.engine-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 16px;margin-bottom:8px}
.engine-metrics .k{font-size:11px;color:var(--muted)}.engine-metrics .v{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}
.sharebar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#eee;margin:8px 0 6px}.sharebar span{display:block;height:100%}
.shareleg{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.findings{list-style:none;margin:0;padding:0}
.findings li{padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin:0 0 8px;background:#fff;border-left:3px solid var(--gsc)}
.findings li.bing{border-left-color:var(--bing)}.findings li.warn{border-left-color:var(--warn)}.findings li.evergreen{border-left-color:var(--ever)}.findings li.auto{border-left-color:#9aa0a6}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-size:11px;color:var(--muted);font-weight:600}
th.txt,td.txt{text-align:left;white-space:normal}
td.sub{padding-left:22px}
tbody tr:hover{background:#fafafa}
tr.total td{font-weight:650}
.chart{width:100%;height:auto;display:block}
.grid{stroke:#f0f0f0}.tick{fill:var(--muted);font-size:10px;font-family:var(--sans)}.legend{fill:var(--ink);font-size:11px;font-family:var(--sans)}
.wknd{fill:#f3efe6}.lag{fill:#f8e4d8;opacity:.7}.pa{fill:#e8f0fe;opacity:.55}.pb{fill:#f1f3f4;opacity:.8}
.spark{display:block;width:100%;height:36px}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.empty{padding:18px;border:1px dashed #d6d9dd;border-radius:10px;color:var(--muted);font-size:12.5px;background:#fbfbfc}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;border-left:3px solid #9aa0a6}
.item.high{border-left-color:var(--down)}.item.mid{border-left-color:var(--warn)}.item.low{border-left-color:#9aa0a6}
.item.opt{border-left-color:var(--gsc)}.item.new{border-left-color:var(--ever)}
.item .t{font-weight:650;margin-bottom:4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.item .row{font-size:12.5px;color:#374151;margin:2px 0}
.item .row b{color:var(--ink);font-weight:600}
.chip{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;background:#f1f3f4;color:#444;font-weight:500}
.chip.red{background:#fce8e6;color:#c5221f}.chip.amber{background:#fef3e0;color:#9a5b00}.chip.green{background:#e6f4ea;color:#137333}.chip.blue{background:#e8f0fe;color:#1a56c2}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin-top:6px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:20;align-items:center;justify-content:center;padding:24px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;max-width:620px;width:100%;padding:22px 24px;box-shadow:0 16px 40px rgba(0,0,0,.15);max-height:85vh;overflow:auto}
.modal h3{margin:0 0 8px;font-size:16px}.modal p,.modal li{margin:0 0 8px;color:#374151;font-size:13px}
.banner{margin:0 28px 10px;padding:8px 14px;border-radius:10px;background:#fef3e0;color:#7a4500;font-size:12.5px}
@media (max-width:960px){.kpis,.engine-metrics,.grid2{grid-template-columns:1fr 1fr}body{flex-direction:column}.sidebar{width:auto;flex:none;height:auto;position:sticky;top:0;z-index:5}.brand,.sidebar-foot,.nav-label{display:none}#nav{display:flex;overflow-x:auto;padding:6px 8px}.nav-group{display:flex;padding:0}.sidebar a{white-space:nowrap}.main{overflow:visible}.content,.topbar{padding-left:16px;padding-right:16px}.periodbar,.banner{margin-left:16px;margin-right:16px}}
@media (max-width:560px){.kpis,.engine-metrics,.grid2{grid-template-columns:1fr}}
@media print{.sidebar,.top-actions{display:none}section.view{display:block!important}}
</style>
